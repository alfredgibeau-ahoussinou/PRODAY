# Connexion compte joueur (Reels publish, etc.).
# Variables : MAESTRO_PLAYER_EMAIL, MAESTRO_PLAYER_PASSWORD
# Défauts : alfredgibeauahoussinou@gmail.com après npm run test-account:setup
appId: com.proday.app
---
- launchApp:
    clearState: false

# Déjà connecté en shell joueur (onglet Reels visible, pas de shell sponsor)
- extendedWaitUntil:
    visible: Reels
    timeout: 12000
    optional: true

- runFlow:
    when:
      visible: Se connecter
    commands:
      - tapOn:
          text: Profil
          optional: true
      - extendedWaitUntil:
          visible: Se connecter
          timeout: 8000
      - tapOn: vous@exemple.com
      - inputText: ${MAESTRO_PLAYER_EMAIL}
      - tapOn: "••••••••"
      - inputText: ${MAESTRO_PLAYER_PASSWORD}
      - hideKeyboard
      - tapOn: Se connecter
      - extendedWaitUntil:
          visible: Reels
          timeout: 45000

- runFlow:
    when:
      notVisible: Reels
    commands:
      - tapOn:
          text: Profil
          optional: true
      - extendedWaitUntil:
          visible: Se connecter
          timeout: 12000
      - tapOn: vous@exemple.com
      - eraseText
      - inputText: ${MAESTRO_PLAYER_EMAIL}
      - tapOn: "••••••••"
      - eraseText
      - inputText: ${MAESTRO_PLAYER_PASSWORD}
      - hideKeyboard
      - tapOn: Se connecter
      - extendedWaitUntil:
          visible: Reels
          timeout: 45000
