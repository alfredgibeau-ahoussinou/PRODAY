# Connexion compte sponsor (partenaire).
# Variables : MAESTRO_SPONSOR_EMAIL, MAESTRO_SPONSOR_PASSWORD
# Défauts documentés dans e2e/README.md — part@gmail.com après npm run partner-account:setup
appId: com.proday.app
---
- launchApp:
    clearState: false

# Déjà connecté en shell sponsor
- extendedWaitUntil:
    visible:
      id: sponsor-top-bar
    timeout: 10000
    optional: true

- runFlow:
    when:
      notVisible:
        id: sponsor-top-bar
    commands:
      - tapOn:
          text: Profil
          optional: true
      - extendedWaitUntil:
          visible: Se connecter
          timeout: 8000
      - tapOn: vous@exemple.com
      - inputText: ${MAESTRO_SPONSOR_EMAIL}
      - tapOn: "••••••••"
      - inputText: ${MAESTRO_SPONSOR_PASSWORD}
      - hideKeyboard
      - tapOn: Se connecter
      - extendedWaitUntil:
          visible:
            id: sponsor-top-bar
          timeout: 45000
