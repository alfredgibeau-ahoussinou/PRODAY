# Monorepo — site vitrine Next.js dans website/ (voir website/netlify.toml)
# Ne pas définir publish : @netlify/plugin-nextjs gère .netlify/static + fonctions SSR.
[build]
  base = "website"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Domaine canonique : https://proday75.fr
[[redirects]]
  from = "http://proday75.fr/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.proday75.fr/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.proday75.fr/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://proday.app/*"
