# Monorepo — site vitrine Next.js dans website/ (voir website/netlify.toml)
[build]
  base = "website"
  command = "npm run build"
  publish = "website/.next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Domaine canonique : https://proday75.fr
[[redirects]]
  from = "/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true
  conditions = {Host = ["proday.app", "www.proday.app", "proday75.netlify.app", "www.proday75.fr"]}
