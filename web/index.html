<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ProDay" />
    <meta name="format-detection" content="telephone=no" />
    <title>ProDay</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #06090E;
        color: #F8FAFC;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        overflow: hidden;
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        display: flex;
        height: 100%;
        min-height: 100%;
        flex: 1;
        width: 100%;
      }
      /* Ensure WebKit touch scrolling behaves smoothly on mobile */
      [data-focusable="true"],
      input,
      textarea,
      select {
        font-family: inherit;
      }
    </style>
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <noscript>
      Vous devez activer JavaScript pour exécuter l'application ProDay.
    </noscript>
    <div id="root"></div>
  </body>
</html>
