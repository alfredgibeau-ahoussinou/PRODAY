<!--
  ProDay — E-mail Auth unifié (LEGACY — préférer auth-verification.html + auth-password-reset.html)
  EmailJS → auth.emailjs_template_id (repli si les IDs séparés ne sont pas définis)

  Design aligné sur firebase/auth-email-templates/verification.html et password-reset.html.

  Settings EmailJS :
  - To Email  : {{email}}
  - From Name : {{app_name}}
  - Subject   : {{subject}}
  - Reply To  : proday.admin@gmail.com
  - Plain Text (optionnel) : docs/emailjs/auth-action.txt

  Variables (functions/src/authEmailJsParams.ts) :
  - email, to_email, user_email — destinataire
  - subject — objet (vérification ou reset)
  - headline — titre affiché (vérification ou reset)
  - app_name — ProDay
  - body_intro — 1er paragraphe (vérification ou reset)
  - body_action — 2e paragraphe (« Cliquez sur le bouton… »)
  - cta_label / button_text — libellé du bouton
  - footer_note — note de bas de page
  - email_kind — verification | password-reset
  - action_link / verification_url — lien Firebase Auth
  - site_url — ex. https://proday75.fr
  - message_text — version texte brut (secours)
  - display_name — prénom optionnel
  - display_name_greeting — " Jean" ou vide (après Bonjour)
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#0a0a0a;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0;padding:0;background-color:#0a0a0a;">
    <tr>
      <td align="center" style="padding:48px 24px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width:600px;width:100%;background-color:#111111;border-radius:16px;border:1px solid #1f1f1f;">
          <tr>
            <td align="center" style="padding:48px 40px 32px 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;background-color:#ffffff;border-radius:12px;">
                <tr>
                  <td align="center" style="padding:12px 16px;">
                    <img src="https://proday75.fr/branding/logo-proday-official.png" width="180" alt="ProDay" style="display:block;border:0;outline:none;text-decoration:none;height:auto;margin:0 auto;">
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 40px 16px 40px;">
              <h1 style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:28px;line-height:36px;font-weight:700;color:#22d3ee;">{{headline}}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 24px 40px;">
              <p style="margin:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:28px;color:#ffffff;">
                Bonjour{{display_name_greeting}},
              </p>
              <p style="margin:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:28px;color:#e5e5e5;">
                {{body_intro}}
              </p>
              <p style="margin:0 0 24px 0;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:28px;color:#22d3ee;font-weight:600;word-break:break-all;">
                {{email}}
              </p>
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:28px;color:#e5e5e5;">
                {{body_action}}
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 40px 32px 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#22d3ee" style="border-radius:12px;background-color:#22d3ee;">
                    <a href="{{action_link}}" target="_blank" style="display:inline-block;padding:18px 40px;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:24px;font-weight:700;color:#0a0a0a;text-decoration:none;border-radius:12px;">{{cta_label}}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 32px 40px;">
              <p style="margin:0 0 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#a3a3a3;">
                Si le bouton ne fonctionne pas, copiez ce lien dans votre navigateur&nbsp;:
              </p>
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#737373;word-break:break-all;">
                {{action_link}}
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 40px 40px;border-top:1px solid #1f1f1f;">
              <p style="margin:24px 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#a3a3a3;">
                {{footer_note}}
              </p>
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#737373;">
                — {{app_name}}<br>
                <a href="mailto:proday.admin@gmail.com" style="color:#22d3ee;text-decoration:none;">proday.admin@gmail.com</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
