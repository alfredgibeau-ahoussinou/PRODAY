# ProDay — Next.js sur Netlify (OpenNext)
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = ["proday75.netlify.app", "www.proday75.fr", "proday.app", "www.proday.app"]

[[redirects]]
  from = "/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = ["proday75.fr", "www.proday75.fr"]
    Scheme = ["http"]

# En-têtes de sécurité (toutes les réponses, y compris statiques)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-DNS-Prefetch-Control = "off"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
