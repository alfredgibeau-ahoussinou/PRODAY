# ProDay — Next.js sur Netlify (OpenNext)
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  NEXT_PUBLIC_SITE_URL = "https://proday75.fr"
  NEXT_PUBLIC_BETA_APP_VERSION = "1.0.0"
  NEXT_PUBLIC_BETA_APK_URL = "https://storage.googleapis.com/proday-155b0.firebasestorage.app/beta/proday-beta.apk"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/downloads/proday-beta.apk"
  to = "https://storage.googleapis.com/proday-155b0.firebasestorage.app/beta/proday-beta.apk"
  status = 302
  force = true

[[redirects]]
  from = "/partenaires"
  to = "/sponsor"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = ["proday75.netlify.app", "www.proday75.fr", "proday.app", "www.proday.app"]

[[redirects]]
  from = "/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = ["proday75.fr", "www.proday75.fr"]
    Scheme = ["http"]

# En-têtes de sécurité (toutes les réponses, y compris statiques)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(self), camera=(self \"https://cal.com\" \"https://*.cal.com\" \"https://app.cal.com\" \"https://whereby.com\" \"https://*.whereby.com\" \"https://*.daily.co\"), cross-origin-isolated=(), display-capture=(self \"https://cal.com\" \"https://*.cal.com\" \"https://whereby.com\" \"https://*.whereby.com\"), encrypted-media=(), fullscreen=(self \"https://cal.com\" \"https://*.cal.com\" \"https://app.cal.com\" \"https://whereby.com\" \"https://*.whereby.com\"), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self \"https://cal.com\" \"https://*.cal.com\" \"https://app.cal.com\" \"https://whereby.com\" \"https://*.whereby.com\" \"https://*.daily.co\"), midi=(), payment=(), picture-in-picture=(self), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()"
    X-DNS-Prefetch-Control = "off"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.emailjs.com https://*.cloudfunctions.net https://*.cal.com https://cal.com https://*.whereby.com https://whereby.com https://*.daily.co; frame-src 'self' https://cal.com https://*.cal.com https://app.cal.com https://whereby.com https://*.whereby.com https://*.daily.co; media-src 'self' blob: https://*.daily.co https://*.whereby.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"proday-beta.apk\""
    Cache-Control = "public, max-age=3600"
