# ProDay — Next.js sur Netlify (OpenNext)
# UI Netlify : Base directory = website
# publish = ".next" écrase le répertoire « dist » de l’UI.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"
