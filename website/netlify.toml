# ProDay — Next.js sur Netlify (OpenNext)
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = ["proday75.netlify.app", "www.proday75.fr", "proday.app", "www.proday.app"]

[[redirects]]
  from = "/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = ["proday75.fr", "www.proday75.fr"]
    Scheme = ["http"]
