# ProDay — Next.js sur Netlify (OpenNext)
# UI Netlify : Base directory = website
# Ne pas définir publish : @netlify/plugin-nextjs gère .netlify/static + fonctions SSR.

[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Domaine canonique : https://proday75.fr
# (dupliqué ici car le build s'exécute depuis website/ — garantit l'application au déploiement)

[[redirects]]
  from = "http://proday75.fr/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.proday75.fr/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.proday75.fr/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://proday.app/*"
  to = "https://proday75.fr/:splat"
  status = 301
  force = true

